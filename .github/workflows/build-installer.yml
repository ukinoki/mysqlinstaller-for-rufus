name: Build Installers (Windows + Linux + macOS)

# Déclenché :
#   • automatiquement quand tu pousses un tag  v1.0 / v1.1 / etc.
#   • manuellement depuis l'onglet "Actions" (bouton "Run workflow") : renseigne
#     "release_tag" (ex. v1.2) pour publier une Release avec les TROIS paquets
#     (Windows .exe + Linux .AppImage + macOS .dmg). Vide = build seul (artefacts).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de release à créer (ex. v1.2). Vide = pas de Release, juste les builds."
        required: false
        default: ''

permissions:
  contents: write   # nécessaire pour créer une Release GitHub

jobs:
  # ===========================================================================
  #  Windows : exécutable + installeur Inno Setup
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-windows | Out-Null
          Set-Location build-windows
          qmake ..\MySQLInstaller.pro CONFIG+=release
          if ($LASTEXITCODE -ne 0) { throw "qmake a échoué." }
          nmake
          if ($LASTEXITCODE -ne 0) { throw "nmake a échoué." }

      - name: Deploy Qt runtime (windeployqt)
        id: deploy
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build-windows -Recurse -Filter "MySQLInstaller.exe" |
                 Select-Object -First 1
          if (-not $exe) { throw "MySQLInstaller.exe introuvable après le build." }
          windeployqt --release --no-translations --compiler-runtime $exe.FullName
          Write-Output "exe_dir=$($exe.DirectoryName)" >> $env:GITHUB_OUTPUT

      - name: Create installer (Inno Setup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          iscc MySQLInstallerForRufusSetup.iss "/DSourceDir=${{ steps.deploy.outputs.exe_dir }}"
          if (-not (Test-Path "dist\MySQLInstallerForRufusSetup.exe")) {
            throw "L'installeur n'a pas été généré."
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist\MySQLInstallerForRufusSetup.exe
          if-no-files-found: error

  # ===========================================================================
  #  Linux : AppImage via build_linux.sh (qmake → make → linuxdeployqt)
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      # Dépendances système : FUSE (outils AppImage) + bibliothèques xcb/GL que
      # linuxdeployqt doit trouver pour les embarquer (plugin plateforme Qt).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libgl1

      - name: Build AppImage
        run: |
          export QT_BIN="$QT_ROOT_DIR/bin"
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/install_appimage.sh
          if-no-files-found: error

  # ===========================================================================
  #  macOS : application UNIVERSELLE (arm64 + x86_64) + DMG
  #  Le Qt officiel macOS est universel, donc un seul build produit un binaire
  #  qui tourne sur Mac Intel ET Apple Silicon → un seul .dmg pour tous.
  # ===========================================================================
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          cache: true

      - name: Build universal app + DMG
        run: |
          set -e
          QT_BIN="$QT_ROOT_DIR/bin"
          mkdir -p build-macos && cd build-macos
          # QMAKE_APPLE_DEVICE_ARCHS : compile les deux tranches en une passe.
          "$QT_BIN/qmake" ../MySQLInstaller.pro CONFIG+=release \
              QMAKE_APPLE_DEVICE_ARCHS="x86_64 arm64"
          make -j"$(sysctl -n hw.logicalcpu)"
          # macdeployqt embarque les frameworks Qt (universels) dans le .app.
          "$QT_BIN/macdeployqt" MySQLInstaller.app -always-overwrite
          echo "Architectures du binaire :"
          lipo -archs MySQLInstaller.app/Contents/MacOS/MySQLInstaller
          cd ..
          # Génération du DMG (dossier de staging + lien /Applications).
          mkdir -p dist
          STAGE="$(mktemp -d)"
          cp -R build-macos/MySQLInstaller.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "MySQL Installer" -srcfolder "$STAGE" \
                         -ov -format UDZO dist/MySQLInstaller_macOS_Universal.dmg
          rm -rf "$STAGE"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/MySQLInstaller_macOS_Universal.dmg
          if-no-files-found: error

  # ===========================================================================
  #  Release : publie les TROIS paquets ensemble (sur tag ou release_tag)
  # ===========================================================================
  release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: "MySQL Installer for Rufus ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}"
          files: |
            artifacts/MySQLInstallerForRufusSetup.exe
            artifacts/*.AppImage
            artifacts/install_appimage.sh
            artifacts/*.dmg
          body: |
            ## MySQL Installer for Rufus ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}

            ### Windows 10/11
            Téléchargez `MySQLInstallerForRufusSetup.exe` et exécutez-le (les
            droits administrateur sont demandés automatiquement).
            > ⚠️ Si SmartScreen avertit : « Informations complémentaires » →
            > « Exécuter quand même » (exe non encore signé Authenticode).

            ### Linux (Ubuntu ≥ 22.04)
            `sudo apt install libfuse2` (une fois), puis :
            - **Lancement direct** : `chmod +x *.AppImage` puis double-clic.
            - **Installation dans le menu** (équivalent setup.exe) : téléchargez
              aussi `install_appimage.sh` (à côté de l'AppImage) et lancez
              `./install_appimage.sh` — l'app apparaît dans le menu (désinstaller :
              `./install_appimage.sh --uninstall`).
            > L'application demande le mot de passe via pkexec au besoin.

            ### macOS (Intel + Apple Silicon)
            Ouvrez `MySQLInstaller_macOS_Universal.dmg` (binaire **universel**,
            valable sur Mac Intel et Apple Silicon) puis glissez l'application dans
            **Applications**.
            > ⚠️ Application non signée (pas de Developer ID) : au 1ᵉʳ lancement,
            > clic droit sur l'app → « Ouvrir » → « Ouvrir », ou Réglages Système ▸
            > Confidentialité et sécurité ▸ « Ouvrir quand même ».
            > L'application demande le mot de passe administrateur au besoin.
